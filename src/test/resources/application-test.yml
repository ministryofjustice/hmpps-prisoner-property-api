server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

api:
  base:
    url:
      prisoner-search: "http://localhost:8091"
      prison-register: "http://localhost:8092"
      locations-inside-prison: "http://localhost:8093"
      prison-api: "http://localhost:8094"

system:
  client:
    id: clientid
    secret: clientsecret

spring:
  datasource:
    url: 'jdbc:postgresql://localhost:5432/prisoner_property'
    username: prisoner_property
    password: prisoner_property
    hikari:
      maximum-pool-size: 5

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# The SAR test library's approval files. See SubjectAccessRequestLibraryTest for what each check guards.
hmpps.sar:
  tests:
    attachments-expected: false
    # Bump only after checking the new migration against the SAR response. V16 and V17 add comments only.
    # V18 adds the legacy clean-up job and item tables. The item holds a prisoner number, but what it
    # records about the person - that their property was returned or sent on, and when - is already in the
    # report as an event on the container itself; the row is the job's own working state. Confirm that with
    # the Offender SAR team as part of the data review (MAPB-768). V19 adds an example value to each
    # column comment for that review's extract, and V20 records against each column whether it is
    # disclosed in a report - comments only, no schema or data change.
    expected-flyway-schema-version: 20
    expected-api-response:
      path: /sar/expected-api-response.json
    expected-jpa-entity-schema:
      path: /sar/expected-jpa-entity-schema.json
    expected-render-result:
      path: /sar/expected-render-result.html
